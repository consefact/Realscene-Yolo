# ============================================================================
# 通用 YOLO 数据增强流水线 —— 唯一配置源
# 换检测任务时，原则上只需改本文件，无需改任何脚本源码。
# 所有相对路径都相对本文件所在目录（项目根）解析。
# ============================================================================

# 类别列表：唯一来源。列表下标即 YOLO 的 class_id。
# 目标图片须按 `<目标目录>/<类名>/*.png` 组织，子文件夹名要与这里完全一致。
# 下面即当前任务（7 类物体检测）的实例配置；换任务时改这里。
classes: [orange, block, bar, coke, football, goal, dashed]

# ---------------------------------------------------------------------------
# 路径（相对项目根；也可写绝对路径）
# ---------------------------------------------------------------------------
paths:
  backgrounds:  ./seven/backgrounds      # 背景图目录（realscene 的底图）
  synth_output: ./seven/train_output     # realscene/multi_rs 合成结果（图+标注）
  dataset:      ./seven/HDATASET         # organize 输出 / 训练数据集根
  check_output: ./seven/check_samples    # 可视化检查输出
  yolo_runs:    ./yolo_run               # 训练 project 目录
  base_weights: yolov8n.pt               # 训练起始权重

# ---------------------------------------------------------------------------
# 合成 + 自动标注（realscene.py / multi_rs.py 共用）
# ---------------------------------------------------------------------------
synth:
  base_size: [640, 640]            # 输出图尺寸（YOLO 训练尺寸）
  num_rounds: 3000                 # 单 epoch 图数上限：目标池用完即提前停止，调大不会多产（≥容量即可）
  epochs: 50                       # 数据量开关：每 epoch 清空目标池重复增强一遍；总图数≈epochs×单epoch产出（单 epoch≈目标数/每图平均贴数）
  num_targets_per_image: 8         # 每张图最多贴几个目标
  target_repeat: 1                 # 每个目标每 epoch 复用次数。单/少图实例模式（每类只有一张/几张）时调大
                                   # 直接放大数据量：如 1 类 1 图、每图贴 3 个 → repeat 20 ≈ 单 epoch 产出 7 张
  background_ratio: 0.1            # 空镜负样本比例：该比例的图不贴目标、标签为空（降低误检；0=关闭）
  min_crop_ratio: 0.4              # 背景随机裁剪最小比例
  max_crop_ratio: 0.9              # 背景随机裁剪最大比例
  min_target_ratio: 0.2            # 目标占画布最小比例
  max_target_ratio: 0.6            # 目标占画布最大比例
  max_target_failure: 8            # 单图放置失败上限
  max_overlap_attempts: 20         # 单目标找不重叠位置的尝试上限
  to_border: 1.0e-6                # 归一化坐标的边界安全距离
  jpeg_quality: 95                 # 合成图输出 JPEG 质量
  backend: gpu                     # gpu（单进程批量张量）| cpu（realscene/multi_rs）| auto（有CUDA则gpu）
  gpu_batch: 32                    # GPU 引擎每批合成图数（显存/吞吐折中；4000 系建议 32-64）
  gpu_jpeg_workers: 4              # GPU 引擎 JPEG 保存线程数
  num_workers: 1                   # 1 → 用 realscene.py（单进程）；>1 → 用 multi_rs.py（多进程）
  profile: null                    # 可选：校准工具生成的增强覆盖 YAML（tools/calibrate_augment_profile.py），
                                   # 加载时与下面的 aug 段深合并（相对项目根）

  # 增强菜单：每层一个菜单，每张图从菜单抽 num[0]~num[1] 种增强，抽完后以 extra_prob 再补一次。
  # 项字段：type 必填；prob 触发概率；其余参数名随 type（range=[lo,hi] 统一为均匀采样）。
  # 替换了旧式 apply_geometric_aug / apply_ink_reflection 开关——由菜单里的 prob 控制（0=关闭）。
  aug:
    base:                          # 背景增强（裁剪缩放到 base_size 之后、贴目标之前）
      num: [2, 6]
      extra_prob: 0.3
      menu:
        - {type: brightness, prob: 0.5, range: [0.6, 1.35]}
        - {type: contrast,   prob: 0.5, range: [0.8, 1.2]}
        - {type: color,       prob: 0.5, range: [0.5, 1.5]}
        - {type: hsv,         prob: 0.5, delta: 0.1}
        - {type: cutout,      prob: 0.5, mask_size: [50, 100], num_masks: [1, 5]}
        - {type: geometric,   prob: 0.0, distortion: 0.1}   # 默认关闭（透视增强，开启可能改边框特征）
    target:                        # 目标增强（贴入前，RGB 部分，alpha 保持不变）
      menu:
        - {type: brightness, prob: 1.0, range: [0.7, 1.35]}
        - {type: contrast,   prob: 1.0, range: [0.8, 1.2]}
        - {type: sharpness,  prob: 0.25, range: [0.8, 1.2]}
        - {type: color,      prob: 0.35, range: [0.5, 1.5]}
        - {type: flip,       prob: 0.5}
    final:                         # 整图噪声（贴完所有目标之后）
      menu:
        - {type: gaussian,      prob: 0.5, var: [1, 10]}
        - {type: salt_pepper,   prob: 0.3, amount: [0.001, 0.005]}
        - {type: poisson,       prob: 0.3, intensity: 0.1}
        - {type: ink_reflection, prob: 0.0}                  # 默认关闭（油墨反光，需要时开启）

  # 目标类型：每类目标一个来源目录 + ROI 定义 + 缩放范围。
  #   roi: null              → 整张目标图就是检测框（最常用）
  #   roi: [rx, ry, rw, rh]  → 目标图是"底板"，只框内部 ROI（相对目标框的比例）
  # 可配置多个类型，realscene 会全部加载并混合使用。
  target_types:
    objects:
      dir: ./seven/targets           # 目标样例目录，按类分子目录（子目录名=classes）
      roi: null                      # 整图即目标；若目标是底板只想框内部，改成 [rx,ry,rw,rh]
      scale: [0.5, 1.0]             # 目标初始缩放范围
      rotate: [-45, 45]              # 旋转角度范围（紧框：标注取旋转后真实物体轴对齐框）
      perspective: [0.5, 0.10]      # [prob, distortion] 透视形变(模拟相机畸变/倾斜视角)：
                                    # 50% 概率、四角独立扰动 ±10% 最短边；null=关闭。标注仍紧贴变形后物体
      feather: 4                     # 边缘羽化半径(px)（消灭抠图硬边；0=关闭）
      crop_transparent: true         # 贴入前裁掉 alpha=0 的透明边距（紧框更准）
    # ---- 底板 + ROI 示例（复现原 CIFAR 版的 34/32 内缩，可按需启用）----
    # synthetic:
    #   dir: ./synthetic_targets
    #   roi: [0.34, 0.34, 0.32, 0.32]
    #   scale: [0.5, 1.0]
    # ---- 真实识别区裁剪图（整图即目标，缩放范围偏大）----
    # original:
    #   dir: ./original_targets
    #   roi: null
    #   scale: [0.8, 1.2]

# ---------------------------------------------------------------------------
# 数据集切分（organize.py）
# ---------------------------------------------------------------------------
dataset:
  val_ratio: 0.2                   # 验证集比例（train/val）

# ---------------------------------------------------------------------------
# 可视化检查（check/label/partial_check.py）
# ---------------------------------------------------------------------------
check:
  num_samples: 50                  # partial_check 随机抽样可视化的数量

# ---------------------------------------------------------------------------
# 训练（y8train.py；dataset.yaml 由此自动生成）
# ---------------------------------------------------------------------------
train:
  epochs: 50
  imgsz: 1280                       # 训练/推理尺寸（与导出 ONNX、X-AnyLabeling 推理保持一致）
  batch: 64
  workers: 4
  dropout: 0.5
  patience: 20
  optimizer: SGD
  lr0: 0.001
  run_name: seven_class            # 训练结果子目录名（yolo_runs/<run_name>）

# ---------------------------------------------------------------------------
# 微调（finetune.py：从 best.pt 出发，混入实拍标注数据继续训，避免灾难性遗忘）
# 前置：实拍图需已标注（可先用 quick_test.py --save-labels 预标注再人工纠正）
# ---------------------------------------------------------------------------
finetune:
  real_dir: ./seven/real           # 实拍标注数据：real/images + real/labels（或 flat 图+同名txt）
  oversample: 5                    # 实拍图在训练集里的重复倍数（少量真实数据加权）
  epochs: 200
  lr0: 0.001                       # 小学习率，避免冲垮预训练权重
  freeze: 0                        # 冻结前 N 层（0=不冻结；实拍很少可试 10）
  run_name: seven_class_ft         # 微调输出子目录（不覆盖原 best.pt）

# ---------------------------------------------------------------------------
# 采集（run.py 自动连拍 / manual_shot.py 手动拍）
# ---------------------------------------------------------------------------
capture:
  save_dir: ./save_frame
  class_name: nowclass             # manual_shot 分类子目录名（按需改）
  camera_index: 0
  frame_width: 640
  frame_height: 480
  auto_every_n: 5                  # run.py 每隔 N 帧存一张

# ---------------------------------------------------------------------------
# 内置"整图即目标"范例生成器（generate_letters.py，仅演示用）
# ---------------------------------------------------------------------------
generate_letters:
  output_dir: ./letter_targets
  num_per_class: 500

# ---------------------------------------------------------------------------
# 内置"底板 + ROI"范例生成器（target/smooth_target.py，仅演示用）
# 把 objects_dir/<类名>/*.png 里的识别区贴到底板中心，产出与上面 roi 对应的底板图。
# ---------------------------------------------------------------------------
smooth_target:
  objects_dir: ./recognition_regions   # 识别区来源（按类分子目录）
  real_targets_dir: none                # 真实空底板照片目录；none=用合成底板
  output_dir: ./synthetic_targets       # 底板目标输出（对应某个 target_type.dir）
  board_size: 100                       # 底板边长(px)
  object_size: 32                       # 识别区缩放后边长(px)
  paste_offset: 34                      # 识别区粘贴左上角偏移(px)；(board-object)/2 居中
  prob_use_real: 1.0                    # 使用真实底板的概率（0~1）
