# ============================================================================
# delivery-3 ROI 参数（由 tools/auto_roi.py 自动测量）
# 素材：delivery/target/clean/<类>.png（环+中心完整图） + delivery/target/inner/<类>.png
#       （仅中心识别区，与 clean 同画布）→ inner alpha bbox ÷ clean 画布 = roi
# 校验：与 inner/<类>_overlay.jpg 红圈比对，中心偏移 ≤1px，宽度比 0.99（tank/bridge 人工核验）
# 语义：贴图=完整环+中心（外围靶标保留作上下文），标注=roi 只框中心识别区。
# ============================================================================

# ---- 方案 A：统一 ROI（推荐起手，一个 target_type）----
# 5 类加权均值；每类差异 ≤±0.03（≈30px@1000px图），对训练影响极小
unified_roi: [0.2493, 0.2644, 0.4990, 0.4676]

# ---- 方案 B：按类精确（roi 差异主要来自中心内容大小/位置差异）----
per_class_roi:
  bridge:   [0.2443, 0.2665, 0.5182, 0.4641]
  car:      [0.2519, 0.2585, 0.4706, 0.4708]
  pillbox:  [0.2461, 0.2661, 0.5049, 0.4746]
  tank:     [0.2664, 0.2667, 0.4662, 0.4656]
  tent:     [0.2376, 0.2642, 0.5353, 0.4631]

# ---- 无环类：H/cross 整图即目标（roi: null）----
# 这两类不含外围靶标，素材即中心识别区本身（delivery-3/target/H.png、cross.png）
no_roi_classes: [H, cross]

# ---- config.yaml target_types 片段（对应方案 A）----
target_types_fragment_A: |
  target_types:
    ring_center:            # 5 类：贴图=clean 全图（环保留），框=只框中心识别区
      dir: ./delivery/target/clean
      roi: [0.2493, 0.2644, 0.4990, 0.4676]
      scale: [0.3, 1.2]
      rotate: [-180, 180]
      perspective: [0.5, 0.20]
      feather: 4
      crop_transparent: true
    h_and_cross:            # H/cross 无环：整图即目标
      dir: ./delivery-3/target
      roi: null
      scale: [0.3, 1.2]
      rotate: [-180, 180]
      perspective: [0.5, 0.20]
      feather: 4
      crop_transparent: true

# ---- config.yaml target_types 片段（对应方案 B，按类拆分）----
target_types_fragment_B: |
  target_types:
    roi_bridge:   {dir: ./delivery/target/clean/bridge,   roi: [0.2443, 0.2665, 0.5182, 0.4641]}
    roi_car:      {dir: ./delivery/target/clean/car,      roi: [0.2519, 0.2585, 0.4706, 0.4708]}
    roi_pillbox:  {dir: ./delivery/target/clean/pillbox,  roi: [0.2461, 0.2661, 0.5049, 0.4746]}
    roi_tank:     {dir: ./delivery/target/clean/tank,     roi: [0.2664, 0.2667, 0.4662, 0.4656]}
    roi_tent:     {dir: ./delivery/target/clean/tent,     roi: [0.2376, 0.2642, 0.5353, 0.4631]}
    h_and_cross:  {dir: ./delivery-3/target,              roi: null}
  # 注：方案 B 要求 clean 图按 <dir>/<类>/*.png 组织（每类子目录一张），
  #     目录名/文件名需与 classes 完全一致。

# ---- 用法摘要 ----
# 1. 编辑 delivery 分支 config.yaml：把 target_types 段替换为上面某方案；
# 2. 小规模验证：python realscene/gpu_synth.py --backend gpu --epochs 2（或 1）；
# 3. check/label/partial_check.py 抽查标注框是否只罩中心；
# 4. 确认无误后调大 epochs 放量。
# 注意：方案 A 的 dir 指向 delivery/target/clean（flat 文件名 = 类名），
#       引擎加载按 <dir>/<类名>/*.png 约定，flat 文件时走 file_classes 分支，
#       需要 clean 文件名与 classes 完全一致（bridge.png = bridge 类）。
